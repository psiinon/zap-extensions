<!DOCTYPE html>
<html lang="en">
<head>
	<title>ZAP Test Server</title>
	<link href="/tutorial.css" rel="stylesheet" type="text/css" />
	<style>
		#digits input.digit { width: 2em; text-align: center; font-size: 1.5em; margin-right: 0.3em; }
	</style>
</head>
<body>
<div class="roundContainer">
	<h1>Multi-Step Authentication</h1>
	<h2>Sign In &mdash; Step 4 of 4</h2>
	<p>Enter the verification code from your authenticator app for <strong><!-- USER --></strong></p>

	<form id="totpform" action="verify" method="post">
	<input type="hidden" name="pending" value="<!-- PENDING -->">
	<table style="border: none;">
	<tr>
		<td>Code:</td>
		<td><!-- CODE_INPUTS --></td>
	</tr>
	<tr>
		<td></td>
		<td><button id="verify" type="button" onclick="submitform();">Verify</button></td>
	</tr>
	</table>
	</form>
</div>
<script>
var digits = document.querySelectorAll('#digits input.digit');

function submitform() {
	if (digits.length > 0) {
		var code = '';
		digits.forEach(function(d) { code += d.value; });
		document.getElementById("code").value = code;
	}
	document.getElementById("totpform").submit();
}

// One field per digit: move to the next field once a digit is typed, submit on return.
digits.forEach(function(d, i) {
	d.addEventListener('input', function() {
		if (d.value.length === 1 && i + 1 < digits.length) {
			digits[i + 1].focus();
		}
	});
	d.addEventListener('keydown', function(e) {
		if (e.keyCode == 13) {
			submitform();
		}
	});
});

var single = document.getElementById('code');
if (digits.length === 0 && single) {
	single.onkeydown = function(e) {
		if (e.keyCode == 13) {
			submitform();
		}
	};
	single.focus();
} else if (digits.length > 0) {
	digits[0].focus();
}
</script>
</body>
</html>
