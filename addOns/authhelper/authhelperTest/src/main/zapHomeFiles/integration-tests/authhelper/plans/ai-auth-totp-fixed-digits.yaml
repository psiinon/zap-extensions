---
# Checks LLM assisted authentication against the multi-step login test app with a TOTP step which accepts a
# fixed code (1234) entered in one field per digit. The user has the code as the secret with the FIXED algorithm.
# Uses the mock LLM rule set provided by this add-on, so no real LLM is needed.
# Needs a browser, and ZAP to be run in dev mode.
env:
  contexts:
    - name: "ai-auth-totp-fixed-digits"
      urls:
        - "http://localhost:9091/auth/multi-step-auth"
      includePaths:
        - "http://localhost:9091/auth/multi-step-auth.*"
      authentication:
        method: "ai"
        parameters:
          loginPageUrl: "http://localhost:9091/auth/multi-step-auth/"
          hint: "The domain pulldown needs to be set to Project1"
          browserId: "firefox-headless"
        verification:
          method: "response"
          loggedInRegex: "\\QWelcome\\E"
      sessionManagement:
        method: "cookie"
      users:
        - name: "test-user"
          credentials:
            username: "test@test.com"
            password: "password123"
            totp:
              secret: "1234"
              algorithm: "FIXED"
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: false
    progressToStdout: true
  vars: {}
jobs:
  - type: "requestor"
    name: "configure test app"
    requests:
      - url: "http://localhost:9091/auth/multi-step-auth/config?totp=fixed&code=1234&layout=digits&confirm=yes"
        method: "POST"
        responseCode: 200
  - type: "llm-config"
    name: "llm-config"
    parameters:
      deleteExisting: true
      defaultProvider: "mock"
      defaultModel: "mock-llm"
    providers:
      - name: "mock"
        type: "OPENAI_COMPATIBLE"
        endpoint: "http://localhost:9091/llm/mock/authhelper/v1"
        models:
          - "mock-llm"
        trusted: true
  - type: "requestor"
    name: "authenticated home page"
    parameters:
      user: "test-user"
    requests:
      - url: "http://localhost:9091/auth/multi-step-auth/home"
        method: "GET"
        responseCode: 200
  - type: "requestor"
    name: "reset test app"
    requests:
      - url: "http://localhost:9091/auth/multi-step-auth/config?totp=off&confirm=yes"
        method: "POST"
        responseCode: 200
