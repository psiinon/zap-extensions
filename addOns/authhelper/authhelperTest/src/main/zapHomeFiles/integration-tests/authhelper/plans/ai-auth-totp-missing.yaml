---
# Checks LLM assisted authentication fails against the multi-step login test app when a TOTP step is required
# but the user has no TOTP data, the mock LLM then reports MFA_REQUIRED.
# The home page is only served to authenticated users, so the request is redirected to the login page.
# Needs a browser, and ZAP to be run in dev mode.
env:
  contexts:
    - name: "ai-auth-totp-missing"
      urls:
        - "http://localhost:9091/auth/multi-step-auth"
      includePaths:
        - "http://localhost:9091/auth/multi-step-auth.*"
      authentication:
        method: "ai"
        parameters:
          loginPageUrl: "http://localhost:9091/auth/multi-step-auth/"
          hint: "The domain pulldown needs to be set to Project1"
          browserId: "firefox-headless"
        verification:
          method: "response"
          loggedInRegex: "\\QWelcome\\E"
      sessionManagement:
        method: "cookie"
      users:
        - name: "test-user"
          credentials:
            username: "test@test.com"
            password: "password123"
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: false
    progressToStdout: true
  vars: {}
jobs:
  - type: "requestor"
    name: "configure test app"
    requests:
      - url: "http://localhost:9091/auth/multi-step-auth/config?totp=fixed&code=1234&layout=single&confirm=yes"
        method: "POST"
        responseCode: 200
  - type: "llm-config"
    name: "llm-config"
    parameters:
      deleteExisting: true
      defaultProvider: "mock"
      defaultModel: "mock-llm"
    providers:
      - name: "mock"
        type: "OPENAI_COMPATIBLE"
        endpoint: "http://localhost:9091/llm/mock/authhelper/v1"
        models:
          - "mock-llm"
        trusted: true
  - type: "requestor"
    name: "unauthenticated home page"
    parameters:
      user: "test-user"
    requests:
      - url: "http://localhost:9091/auth/multi-step-auth/home"
        method: "GET"
        responseCode: 302
  - type: "requestor"
    name: "reset test app"
    requests:
      - url: "http://localhost:9091/auth/multi-step-auth/config?totp=off&confirm=yes"
        method: "POST"
        responseCode: 200
